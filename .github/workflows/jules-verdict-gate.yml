name: Jules Verdict Gate

on:
  pull_request:
    paths:
      - ".github/workflows/jules-verdict-gate.yml"
      - "scripts/ci/jules-verdict-*.mjs"
      - "scripts/ci/verify-jules-run.mjs"
      - "tests/ci/jules-verdict.test.mjs"
      - "docs/governance/jules-verdict-gate.md"
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Jules PR Review"]
    types: [requested, in_progress, completed]

permissions:
  contents: read

jobs:
  fixtures:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Syntax and negative fixtures
        run: |
          node --check scripts/ci/jules-verdict-core.mjs
          node --check scripts/ci/verify-jules-run.mjs
          node --test tests/ci/jules-verdict.test.mjs

  verify:
    if: github.event_name == 'workflow_run' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
      statuses: write
    steps:
      # Privileged event: run ONLY default-branch code; never checkout PR head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify independently, snapshot reviewer, post distinct PR-head status
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/verify-jules-run.mjs
      - name: Preserve exact UTF-8 preimage in per-run artifact
        if: always() && github.event_name == 'workflow_run' && github.event.action == 'completed'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jules-verdict-attempt-\${{ github.event.workflow_run.id }}-\${{ github.event.workflow_run.run_attempt }}
          path: /tmp/jules-verdict-gate.json
          if-no-files-found: error
          retention-days: 90
