name: Gate 0 Accessibility Regression
on:
  pull_request:
    paths:
      - "apps/web/src/pages/Ledger.css"
      - "apps/web/src/pages/OverviewPage.css"
      - "tests/browser/gate0-accessibility.mjs"
      - ".github/workflows/gate0-accessibility.yml"

permissions:
  contents: read

jobs:
  exact-head-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Record exact revision
        run: git rev-parse HEAD
      - name: Install and verify workspace
        run: |
          npm ci --no-audit --no-fund
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          npm run typecheck
          npm test
          npm run lint
          npm run build
          python3 -m unittest discover -s packages/narrative-references/test -p 'test_provenance.py'
          python3 -m unittest discover -s analysis/local_context/tests -p 'test_*.py'
          bash analysis/local_context/tests/test_candidate_output_verifier.sh
          for manifest in artifacts/reviewed/*/SHA256SUMS; do
            (cd "$(dirname "$manifest")" && sha256sum -c SHA256SUMS)
          done
      - name: Install existing isolated browser runner
        run: |
          npm install --prefix /tmp/diagnostic-browser-runner --no-audit --no-fund --save-exact @playwright/test@1.64.0 axe-core@4.11.1
          node /tmp/diagnostic-browser-runner/node_modules/playwright/cli.js install chrome
      - name: Test actual production build reflow, contrast, keyboard and axe
        env:
          PLAYWRIGHT_RUNNER: /tmp/diagnostic-browser-runner/package.json
          QA_BASE_URL: http://127.0.0.1:4186
          QA_OUTPUT: /tmp/gate0-accessibility
          QA_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./node_modules/.bin/vite preview apps/web --host 127.0.0.1 --port 4186 --strictPort >/tmp/gate0-preview.log 2>&1 &
          for n in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4186/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4186/ -o /dev/null
          node tests/browser/gate0-accessibility.mjs
      - name: Retain exact-head results, screenshots and incomplete axe findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate0-accessibility-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/gate0-accessibility/
            /tmp/gate0-preview.log
          if-no-files-found: warn

  exact-head-r:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - name: Verify exact head with synthetic R pipeline
        run: |
          git rev-parse HEAD
          Rscript analysis/r/install_dependencies.R
          Rscript analysis/r/tests/run_tests.R
