name: Future experience browser checks

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "docs/ai-experience-preview/**"
      - "tests/browser/future-ai-experience.mjs"
      - "tests/browser/future-ai-live-preview.mjs"
      - "tests/browser/verify-ai-handoff-exports.ts"
      - ".github/workflows/future-ai-experience.yml"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  concept-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        build: [disabled, public, protected-preview]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact integrated revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Complete repository checks on integrated head
        if: matrix.build == 'public'
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          npm run typecheck
          npm test
          npm run lint
          python3 -m unittest discover -s packages/narrative-references/test -p 'test_provenance.py'
          python3 -m unittest discover -s analysis/local_context/tests -p 'test_*.py'
          bash analysis/local_context/tests/test_candidate_output_verifier.sh
          for manifest in artifacts/reviewed/*/SHA256SUMS; do
            (cd "$(dirname "$manifest")" && sha256sum -c SHA256SUMS)
          done
      - name: Install isolated browser tools
        run: npm install --prefix /tmp/concept-browser --save-exact --no-audit --no-fund playwright@1.62.1 axe-core@4.11.1
      - name: Build exact concept-enabled or explicitly disabled bundle
        env:
          CONCEPT_BUILD: ${{ matrix.build }}
        run: |
          if [ "$CONCEPT_BUILD" = protected-preview ]; then
            VERCEL_ENV=preview AI_GUIDANCE_ENABLED=on npm run build
          elif [ "$CONCEPT_BUILD" = public ]; then
            VERCEL_ENV=production AI_GUIDANCE_ENABLED=on npm run build
          else
            VITE_FUTURE_AI_EXPERIENCE_DEMO=off npm run build
          fi
      - name: Exercise real browser and capture screenshots
        env:
          CONCEPT_BUILD: ${{ matrix.build }}
          PLAYWRIGHT_RUNNER: /tmp/concept-browser/package.json
          QA_OUTPUT: /tmp/concept-results
          QA_BASE_URL: http://127.0.0.1:4175
        run: |
          npm exec --workspace @diagnostic-odyssey/web -- vite preview --host 127.0.0.1 --port 4175 > /tmp/concept-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          if [ "$CONCEPT_BUILD" = disabled ]; then export QA_BUILD=off; fi
          export QA_CHROME="$(command -v google-chrome)"
          export QA_DIST="$GITHUB_WORKSPACE/apps/web/dist"
          if [ "$CONCEPT_BUILD" = protected-preview ]; then
            node tests/browser/future-ai-live-preview.mjs
          else
            node tests/browser/future-ai-experience.mjs
            if [ "$CONCEPT_BUILD" = public ]; then
              node --experimental-strip-types tests/browser/verify-ai-handoff-exports.ts "$QA_OUTPUT"
            fi
            QA_OUTPUT=/tmp/concept-results/acceptance node tests/browser/acceptance.mjs
            node --experimental-strip-types tests/browser/verify-ai-handoff-exports.ts /tmp/concept-results/acceptance
            QA_OUTPUT=/tmp/concept-results/gate0 node tests/browser/gate0-accessibility.mjs
          fi
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: future-experience-${{ matrix.build }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/concept-results

  integrated-r:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact integrated revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true
      - run: Rscript analysis/r/install_dependencies.R
      - run: Rscript analysis/r/tests/run_tests.R
