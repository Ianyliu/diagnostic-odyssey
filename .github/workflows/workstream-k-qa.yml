name: Workstream K Vercel CSP / header regression
on:
  pull_request:
    paths:
      - "apps/web/**"
      - "tests/browser/security-headers.mjs"
      - "tests/browser/csp-preview-proxy.mjs"
      - ".github/workflows/workstream-k-qa.yml"
  workflow_dispatch:
    inputs:
      immutable_preview_url:
        description: "Actual immutable Vercel preview origin (no path), for effective served-header attestation"
        required: false
        type: string

permissions:
  contents: read

jobs:
  security-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, unit / negative tests, lint and production build
        run: |
          npm run typecheck
          npm test
          npm run lint
          npm run build
      - name: Install isolated browser and axe dependencies
        run: |
          npm install --prefix /tmp/workstream-k-browser --save-exact --no-audit --no-fund @playwright/test@1.64.0 axe-core@4.11.1
          node /tmp/workstream-k-browser/node_modules/playwright/cli.js install chrome
      - name: Browser enforcement behind explicitly simulated Vercel headers (not deployed proof)
        env:
          PLAYWRIGHT_RUNNER: /tmp/workstream-k-browser/package.json
          QA_BASE_URL: http://127.0.0.1:4200
          QA_SECURITY_MODE: simulated-local-proxy
          QA_OUTPUT: /tmp/workstream-k-security
        run: |
          npm exec --workspace @diagnostic-odyssey/web -- vite preview --host 127.0.0.1 --port 4199 --strictPort >/tmp/workstream-k-vite.log 2>&1 &
          vite_pid=$!
          node tests/browser/csp-preview-proxy.mjs >/tmp/workstream-k-proxy.log 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" "$vite_pid" || true' EXIT
          for attempt in {1..50}; do
            if curl --silent --fail http://127.0.0.1:4200/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4200/ >/dev/null
          node tests/browser/security-headers.mjs
          # Legacy axe uses inline script injection; run the pre-existing accessibility/full-matrix baseline on ordinary Vite, not by weakening enforced CSP.
          QA_BASE_URL=http://127.0.0.1:4199 QA_OUTPUT=/tmp/workstream-k-acceptance node tests/browser/acceptance.mjs
      - name: Actual immutable Vercel preview effective headers and browser CSP (optional dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.immutable_preview_url != '' }}
        env:
          PLAYWRIGHT_RUNNER: /tmp/workstream-k-browser/package.json
          QA_BASE_URL: ${{ inputs.immutable_preview_url }}
          QA_SECURITY_MODE: actual-immutable-vercel-preview
          QA_OUTPUT: /tmp/workstream-k-real-preview
        run: node tests/browser/security-headers.mjs
      - name: Archive evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workstream-k-security-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/workstream-k-security
            /tmp/workstream-k-acceptance
            /tmp/workstream-k-real-preview
            /tmp/workstream-k-vite.log
            /tmp/workstream-k-proxy.log
