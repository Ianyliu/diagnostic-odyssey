name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only superseded pull-request runs are cancelled. Pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job ids (`verify`, `r-analysis-tests`) are unchanged so existing required status checks
# ("CI / verify", "CI / r-analysis-tests") keep working. See docs/operations/ci-workflows.md.
jobs:
  verify:
    runs-on: ubuntu-latest
    # Raised from 10 to cover the added characterization, tooling and coverage steps.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up workspace (Node from .nvmrc, npm ci, pinned Python test dependencies)
        uses: ./.github/actions/setup-workspace
        with:
          python-test-dependencies: "true"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Tooling unit tests (reviewed-artifact verifier)
        run: npm run test:tools

      - name: Scientific and contract characterization (exact equivalence to recorded baseline)
        run: npm run test:characterization

      - name: Offline synthetic provenance verification
        run: python3 -m unittest discover -s packages/narrative-references/test -p 'test_provenance.py'

      - name: Local-context contract tests
        run: |
          python3 -m unittest discover -s analysis/local_context/tests -p 'test_*.py'
          bash analysis/local_context/tests/test_candidate_output_verifier.sh

      - name: Verify immutable reviewed artifact checksums (authoritative inventory)
        run: npm run verify:artifacts

      - name: Lint
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Verify repeated-build provenance and byte stability
        run: node apps/web/scripts/verify-repeated-build.mjs

      # Informational diagnostic only: no threshold, never fails the job.
      - name: Test coverage (informational)
        continue-on-error: true
        run: |
          npm run test:coverage 2>&1 | tee coverage/spec-output.txt
          {
            echo '### Test coverage (informational, no thresholds)'
            echo '```'
            grep -E '(all files|file +\|)' coverage/spec-output.txt || echo 'coverage summary unavailable'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  r-analysis-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - name: Install R analysis dependencies
        run: Rscript analysis/r/install_dependencies.R

      - name: Run synthetic MEPS pipeline tests
        run: Rscript analysis/r/tests/run_tests.R
