name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Local-context contract tests
        run: python -m unittest discover -s analysis/local_context/tests -p 'test_*.py'

      - name: Lint
        run: npm run lint

      - name: Build web application
        run: npm run build

  r-analysis-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R analysis dependencies
        run: Rscript analysis/r/install_dependencies.R

      - name: Run synthetic MEPS pipeline tests
        run: Rscript analysis/r/tests/run_tests.R
