name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Install Draft 2020-12 test validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0

      - name: Unit tests
        run: npm test

      - name: Offline synthetic provenance verification
        run: python3 -m unittest discover -s packages/narrative-references/test -p 'test_provenance.py'

      - name: Local-context contract tests
        run: |
          python -m unittest discover -s analysis/local_context/tests -p 'test_*.py'
          bash analysis/local_context/tests/test_candidate_output_verifier.sh

      - name: Verify immutable reviewed artifact checksums
        run: |
          (
            cd artifacts/reviewed/meps-2024-long-covid-candidate-20260923T020607Z/
            sha256sum -c SHA256SUMS
          )
          (
            cd artifacts/reviewed/meps-2024-long-covid-candidate-20260926T011343Z/
            sha256sum -c SHA256SUMS
          )
          (
            cd artifacts/reviewed/local-context-wv-hrsa-acs-candidate-20260924T052332Z/
            sha256sum -c SHA256SUMS
          )
          (
            cd artifacts/reviewed/meps-2024-linked-condition-service-use-reviewed-20260929-v1/
            sha256sum -c SHA256SUMS
          )

      - name: Lint
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Verify repeated-build provenance and byte stability
        run: node apps/web/scripts/verify-repeated-build.mjs

  r-analysis-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - name: Install R analysis dependencies
        run: Rscript analysis/r/install_dependencies.R

      - name: Run synthetic MEPS pipeline tests
        run: Rscript analysis/r/tests/run_tests.R
