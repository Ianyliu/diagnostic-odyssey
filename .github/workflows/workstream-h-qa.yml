name: Workstream H combined PDF and state acceptance

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "tests/browser/workstream-h-qa.mjs"
      - "tests/browser/verify-workstream-h-pdfs.py"
      - "tests/browser/workstream_h_inventory.py"
      - "tests/browser/test_workstream_h_inventory.py"
      - ".github/workflows/workstream-h-qa.yml"
      - "packages/**"
      - "package-lock.json"
      - ".github/actions/setup-workspace/**"
      - ".nvmrc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests share one group per PR, so a newer push supersedes older runs. Every other event
  # (push to main, workflow_dispatch) gets a unique group per run, so no pending run is ever dropped.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  combined-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default
            insights: "off"
            concept: "off"
          - mode: deterministic-only
            insights: "on"
            concept: "off"
          - mode: concept-only
            insights: "off"
            concept: "on"
          - mode: all-enabled
            insights: "on"
            concept: "on"
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact integrated HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: ./.github/actions/setup-workspace
      - name: Build combined feature configuration
        env:
          VITE_PLANNING_INSIGHTS_PREVIEW: ${{ matrix.insights }}
          VITE_FUTURE_AI_EXPERIENCE_DEMO: ${{ matrix.concept }}
        run: npm run build
      - run: npm install --prefix /tmp/workstream-h-browser --save-exact --no-audit --no-fund playwright@1.62.1
      - name: Native Chromium PDF / canonical JSON matrix
        env:
          PLAYWRIGHT_RUNNER: /tmp/workstream-h-browser/package.json
          QA_BASE_URL: http://127.0.0.1:4199
          QA_OUTPUT: /tmp/workstream-h-results
          QA_H_MODE: ${{ matrix.mode }}
          QA_INSIGHTS_MODE: ${{ matrix.insights }}
          QA_CONCEPT_MODE: ${{ matrix.concept }}
        run: |
          npm exec --workspace @diagnostic-odyssey/web -- vite preview --host 127.0.0.1 --port 4199 > /tmp/workstream-h-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4199/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser/workstream-h-qa.mjs
      - name: Inspect every physical PDF page
        run: |
          python3 -m pip install --disable-pip-version-check pdfplumber==0.11.7 PyMuPDF==1.26.5
          python3 tests/browser/verify-workstream-h-pdfs.py /tmp/workstream-h-results
      - name: Check exact postrender output inventory without regeneration
        run: python3 tests/browser/verify-workstream-h-pdfs.py /tmp/workstream-h-results --check-inventory
      - name: Prove omitted/duplicate/corrupt outputs fail closed
        env:
          WORKSTREAM_H_QA_OUTPUT: /tmp/workstream-h-results
        run: python3 -m unittest discover -s tests/browser -p 'test_workstream_h_inventory.py' -v
      - name: Upload matrix, canonical JSON, native PDF, and page-boundary renders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workstream-h-${{ matrix.mode }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/workstream-h-results
            /tmp/workstream-h-preview.log
