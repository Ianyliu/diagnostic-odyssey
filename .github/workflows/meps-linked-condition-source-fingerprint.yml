name: MEPS Linked-Condition Source Fingerprint

on:
  push:
    branches:
      - methods/meps-linked-condition-feasibility
    paths:
      - .github/workflows/meps-linked-condition-source-fingerprint.yml

permissions:
  contents: read

jobs:
  fingerprint:
    name: Fingerprint official AHRQ source bytes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert checkout matches pushed SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$GITHUB_SHA" || {
            echo "Checkout SHA mismatch: HEAD=$ACTUAL_SHA GITHUB_SHA=$GITHUB_SHA"
            exit 1
          }

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install source-probe packages only
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'install.packages(c("jsonlite", "haven"), repos = Sys.getenv("RSPM", unset = "https://cloud.r-project.org"))'

      - name: Fingerprint configured official AHRQ sources
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p fingerprint-output

          Rscript - <<'RS'
          suppressPackageStartupMessages({
            library(jsonlite)
            library(haven)
          })

          cfg_path <- file.path("analysis", "r", "config", "meps_linked_condition_sources.json")
          cfg <- jsonlite::fromJSON(cfg_path, simplifyVector = FALSE)
          sources <- Filter(function(x) !identical(x$puf_id, "HC-256"), cfg$sources)

          if (length(sources) != 6L) {
            stop("Expected exactly six new linked-condition sources; found ", length(sources), call. = FALSE)
          }

          sha256_file <- function(path) {
            out <- system2("sha256sum", path, stdout = TRUE, stderr = TRUE)
            status <- attr(out, "status")
            if (!is.null(status) && status != 0L) {
              stop("sha256sum failed for ", path, ": ", paste(out, collapse = "\n"), call. = FALSE)
            }
            sub("[[:space:]].*$", "", out[[1]])
          }

          fingerprint_one <- function(source) {
            td <- tempfile(paste0(tolower(gsub("-", "", source$puf_id)), "-"))
            dir.create(td, recursive = TRUE)
            on.exit(unlink(td, recursive = TRUE, force = TRUE), add = TRUE)

            archive <- file.path(td, source$expected_archive_filename)
            curl_out <- system2(
              "curl",
              c(
                "--fail",
                "--location",
                "--silent",
                "--show-error",
                "--connect-timeout", "30",
                "--max-time", "300",
                "--retry", "2",
                "--write-out", "%{url_effective}",
                "--output", archive,
                source$download_url
              ),
              stdout = TRUE,
              stderr = TRUE
            )
            curl_status <- attr(curl_out, "status")
            if (!is.null(curl_status) && curl_status != 0L) {
              stop(source$puf_id, " official HTTP acquisition failed: ", paste(curl_out, collapse = "\n"), call. = FALSE)
            }
            if (!file.exists(archive) || file.info(archive)$size <= 0) {
              stop(source$puf_id, " archive is missing or empty.", call. = FALSE)
            }
            resolved_url <- tail(curl_out, 1)

            members <- utils::unzip(archive, list = TRUE)
            if (!nrow(members)) {
              stop(source$puf_id, " ZIP has no members.", call. = FALSE)
            }
            expected_name <- tolower(source$expected_data_filename)
            matching <- members$Name[
              tolower(basename(members$Name)) == expected_name
            ]
            if (length(matching) != 1L) {
              stop(
                source$puf_id, " expected exactly one ", source$expected_data_filename,
                " ZIP member; found ", length(matching), ".",
                call. = FALSE
              )
            }
            selected_member <- matching[[1]]

            extract_dir <- file.path(td, "extract")
            dir.create(extract_dir)
            utils::unzip(archive, files = selected_member, exdir = extract_dir)
            dta_path <- file.path(extract_dir, selected_member)
            if (!file.exists(dta_path) || file.info(dta_path)$size <= 0) {
              stop(source$puf_id, " extracted DTA is missing or empty.", call. = FALSE)
            }

            probe <- haven::read_dta(dta_path, n_max = 1)
            observed_variables <- toupper(names(probe))
            required_variables <- toupper(unlist(source$required_variables, use.names = FALSE))
            missing_variables <- setdiff(required_variables, observed_variables)
            if (length(missing_variables)) {
              stop(
                source$puf_id, " required-variable contract failed; missing: ",
                paste(missing_variables, collapse = ", "),
                call. = FALSE
              )
            }

            archive_hash <- sha256_file(archive)
            dta_hash <- sha256_file(dta_path)
            if (!grepl("^[0-9a-f]{64}$", archive_hash) || !grepl("^[0-9a-f]{64}$", dta_hash)) {
              stop(source$puf_id, " produced malformed SHA-256 output.", call. = FALSE)
            }

            list(
              puf_id = source$puf_id,
              source_id = source$source_id,
              configured_source_url = source$download_url,
              resolved_source_url = resolved_url,
              expected_archive_filename = source$expected_archive_filename,
              archive_byte_size = unname(file.info(archive)$size),
              archive_sha256 = archive_hash,
              zip_member_names = as.list(as.character(members$Name)),
              selected_dta_member = selected_member,
              expected_dta_filename = source$expected_data_filename,
              extracted_dta_byte_size = unname(file.info(dta_path)$size),
              extracted_dta_sha256 = dta_hash,
              required_variable_contract_status = "passed",
              required_variables = as.list(required_variables),
              observed_variable_count = length(observed_variables),
              observed_variable_names = as.list(observed_variables),
              source_fingerprint_status = "passed"
            )
          }

          records <- lapply(sources, fingerprint_one)
          manifest <- list(
            generated_at = format(Sys.time(), tz = "UTC", format = "%Y-%m-%dT%H:%M:%SZ"),
            repository = Sys.getenv("REPOSITORY"),
            github_sha = Sys.getenv("GITHUB_SHA"),
            workflow_run_id = Sys.getenv("WORKFLOW_RUN_ID"),
            configured_registry = cfg_path,
            status = "passed",
            source_count = length(records),
            sources = records
          )

          jsonlite::write_json(
            manifest,
            file.path("fingerprint-output", "source-fingerprint-manifest.json"),
            pretty = TRUE,
            auto_unbox = TRUE,
            null = "null"
          )
          RS

      - name: Validate safe fingerprint manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="fingerprint-output/source-fingerprint-manifest.json"
          test -s "$MANIFEST"

          jq -e '
            .status == "passed"
            and .source_count == 6
            and (.sources | length) == 6
            and ([.sources[].puf_id] | sort ==
              ["HC-254D","HC-254E","HC-254F","HC-254G","HC-254I","HC-255"])
            and all(.sources[];
              .source_fingerprint_status == "passed"
              and .required_variable_contract_status == "passed"
              and (.archive_byte_size > 0)
              and (.extracted_dta_byte_size > 0)
              and (.archive_sha256 | test("^[0-9a-f]{64}$"))
              and (.extracted_dta_sha256 | test("^[0-9a-f]{64}$"))
              and (.selected_dta_member | length > 0)
            )
          ' "$MANIFEST" >/dev/null

          test "$(find fingerprint-output -type f | wc -l)" -eq 1
          test "$(basename "$(find fingerprint-output -type f)")" = "source-fingerprint-manifest.json"

          if find fingerprint-output -type f \(             -name '*.dta' -o             -name '*.zip' -o             -name '*.csv' -o             -name '*.rds' -o             -name '*.RData' -o             -name '*.parquet' -o             -name '*.feather'           \) | grep -q .; then
            echo "Refusing upload: data-like file found in fingerprint output."
            exit 1
          fi

      - name: Upload safe source fingerprint manifest only
        uses: actions/upload-artifact@v4
        with:
          name: meps-linked-condition-source-fingerprint-${{ github.run_id }}
          path: fingerprint-output/source-fingerprint-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
