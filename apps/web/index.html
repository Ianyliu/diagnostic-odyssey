<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Diagnostic Odyssey public-health evidence and planning workspace" />
    <script>
      (function () {
        var preference = "system";
        try {
          var stored = localStorage.getItem("diagnostic-odyssey.theme");
          if (stored === "light" || stored === "dark" || stored === "system") preference = stored;
        } catch (_) { /* Storage is optional. */ }
        var systemDark = false;
        try { systemDark = matchMedia("(prefers-color-scheme: dark)").matches; } catch (_) { /* Light fallback. */ }
        document.documentElement.dataset.theme = preference === "system" ? (systemDark ? "dark" : "light") : preference;
        document.documentElement.dataset.themePreference = preference;
      })();
    </script>
    <title>Diagnostic Odyssey</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
